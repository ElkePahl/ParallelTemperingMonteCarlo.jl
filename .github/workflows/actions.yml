name: Run tests

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: [1]
        julia-arch: [x64]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libblas3 liblapack3 libgfortran5
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v2
      - name: "Run tests"
        run: |
          export JULIA_PROJECT=@.
          julia -e "using InteractiveUtils; versioninfo(verbose=true)"
          # Run regular tests
          julia -e "using Pkg; Pkg.test(\"ParallelTemperingMonteCarlo\"; coverage=true);"

      - name: "Process coverage"
        uses: julia-actions/julia-processcoverage@latest
      - name: "Coveralls"
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: ./lcov.info
        if: ${{ matrix.julia-version == '1' }}
